[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "regrep"
version = "0.2.0"
description = "grep the history of the web: regex search across Wayback Machine snapshots of a URL"
readme = "README.md"
license = { file = "LICENSE" }
authors = [{ name = "Kim Slawson" }]
requires-python = ">=3.10"
dependencies = [
    "requests>=2.31",
    "beautifulsoup4>=4.12",
]
keywords = ["wayback", "archive", "memento", "grep", "search", "cli", "web-history"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Internet :: WWW/HTTP :: Indexing/Search",
    "Topic :: System :: Archiving",
    "Topic :: Utilities",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "responses>=0.25",
    "ruff>=0.4",
]

[project.scripts]
regrep = "regrep.cli:main"

[project.urls]
Homepage = "https://github.com/kimslawson/regrep"
Issues = "https://github.com/kimslawson/regrep/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/regrep"]

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
