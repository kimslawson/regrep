name: Release

# Publishes to PyPI when a version tag is pushed, using trusted publishing
# (OpenID Connect) — no API token stored in the repo.
#
# One-time setup on PyPI (https://pypi.org/manage/account/publishing/):
#   Project name:   regrep
#   Owner:          kimslawson
#   Repository:     regrep
#   Workflow name:  release.yml
#   Environment:    pypi
# Then: bump the version in pyproject.toml and src/regrep/__init__.py, commit,
#   and push a matching tag:  git tag v0.3.0 && git push origin v0.3.0

on:
  push:
    tags: ["v*"]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verify tag matches package version
        run: |
          python - <<'PY'
          import pathlib, re, sys, tomllib
          tag = "${{ github.ref_name }}".lstrip("v")
          pyproject = tomllib.loads(pathlib.Path("pyproject.toml").read_text())["project"]["version"]
          init = re.search(
              r'__version__ = "([^"]+)"',
              pathlib.Path("src/regrep/__init__.py").read_text(),
          ).group(1)
          if not tag == pyproject == init:
              sys.exit(f"version mismatch: tag={tag} pyproject={pyproject} __init__={init}")
          print(f"version {tag} OK")
          PY
      - name: Build sdist and wheel
        run: |
          python -m pip install --upgrade pip build
          python -m build
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write # required for trusted publishing
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
